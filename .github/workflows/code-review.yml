name: code-review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: write
  id-token: write

jobs:
  review:
    # Same-repository PRs, plus pushes to master so merged work is reviewed too; the App's own PRs wait until they leave draft.
    if: >
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      || (github.event.issue.pull_request != null && github.event.issue.state == 'open' && github.event.sender.type != 'Bot')
      || (github.event.pull_request.state == 'open' && github.event.pull_request.head.repo.full_name == github.repository
          && (github.event.action != 'ready_for_review' || github.event.pull_request.user.type == 'Bot')
          && (github.event_name == 'pull_request_target' || github.event.sender.type != 'Bot'))
    uses: promplate/code-review/.github/workflows/review.yml@main
    with:
      service-tier: ultrafast
    secrets:
      codex-config: ${{ secrets.CODEX_CONFIG }}
      codex-auth: ${{ secrets.CODEX_AUTH }}
